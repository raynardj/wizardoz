; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; 1. Define 16MB Flash Size
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 2. Enable PSRAM (8MB Octal), USB settings, and TFT_eSPI config for YD-ESP32-23
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; --- TFT_eSPI config (ST7789 240x240) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=8
    -DTFT_RST=9
    -DSPI_FREQUENCY=40000000

; 3. Set Memory Type to Octal (OPI) for both Flash and PSRAM
; N16R8 uses Octal PSRAM, so 'opi' is required.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; 4. Serial monitor speed
monitor_speed = 115200

; 5. Upload settings for USB CDC mode
upload_speed = 921600
upload_before_reset = default_reset
upload_after_reset = hard_reset

; 6. Force esptool to wait for boot mode (helps with USB CDC)
upload_flags = 
    --before=default_reset
    --after=hard_reset

; 7. Library Dependencies
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@^1.4.0
    gilmaimon/ArduinoWebsockets@^0.5.3

; 8. Pin assignments (see include/pin_config.h):
;   I2S Mic (INMP441):   GPIO4 -> BCLK, GPIO5 -> LRCK, GPIO6 -> DATA
;   SPI TFT (ST7789):    GPIO7 -> BLK,  GPIO8 -> DC,   GPIO9 -> RST
;                         GPIO10 -> CS,  GPIO11 -> MOSI, GPIO12 -> SCK