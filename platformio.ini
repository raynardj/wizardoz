; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; 1. Define 16MB Flash Size
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; 2. Enable PSRAM (8MB Octal) and USB settings for YD-ESP32-23
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; 3. Set Memory Type to Octal (OPI) for both Flash and PSRAM
; N16R8 uses Octal PSRAM, so 'opi' is required.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; 4. Serial monitor speed
monitor_speed = 115200

; 5. Upload settings for USB CDC mode
upload_speed = 921600
upload_before_reset = default_reset
upload_after_reset = hard_reset

; 6. Force esptool to wait for boot mode (helps with USB CDC)
upload_flags = 
    --before=default_reset
    --after=hard_reset

; 7. I2S Audio Configuration (PCM5102A DAC)
; Pin assignments defined in src/main.cpp:
;   GPIO4 -> BCK  (Bit Clock)
;   GPIO5 -> LCK  (Word Select / LRCK)
;   GPIO6 -> DIN  (Data Out)
; No additional libraries needed - uses built-in ESP32 I2S driver